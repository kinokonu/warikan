name: pytest
on: [push]
jobs:
    pytest:
        name: Run pytest
        #ubuntu最新版を使用
        runs-on: ubuntu-latest
        steps:
            #リポジトリのコードを取得
            - uses: actions/checkout@v4
            #uvを取得
            - uses: astral-sh/setup-uv@v8
            #pythonをuvに入れる
            - run: uv python install
            # チェック
            - run: uv sync --locked
            #pytestを実行
            - run: uv run pytest